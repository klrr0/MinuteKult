<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MinuteKult</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <h1>MinuteKult 🌍</h1>
    <p class="subtitle">Connexion ou inscription</p>

    <input
        type="text"
        id="pseudo"
        placeholder="Pseudo"
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
    >

    <button id="login-btn">
        Connexion
    </button>

    <button id="register-btn">
        Inscription
    </button>

    <p id="message"></p>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
