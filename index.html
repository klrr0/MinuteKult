<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MinuteKult 🌍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Écran de lancement -->
<div id="splash-screen" class="hidden">
    <h1>MinuteKult 🌍</h1>
</div>

<!-- Écran d'accueil -->
<div id="home-screen" class="hidden">
    <h2>Choisis un thème</h2>

    <!-- Boutons des thèmes -->
    <button class="theme-btn" data-theme="arts">Arts</button>
    <button class="theme-btn" data-theme="cinema">Cinéma</button>
    <button class="theme-btn" data-theme="culture">Culture</button>
    <button class="theme-btn" data-theme="droit">Droit</button>
    <button class="theme-btn" data-theme="geographie">Géographie</button>
    <button class="theme-btn" data-theme="histoire">Histoire</button>
    <button class="theme-btn" data-theme="jeux videos">Jeux Vidéos</button>
    <button class="theme-btn" data-theme="langues">Langues</button>
    <button class="theme-btn" data-theme="litterature">Littérature</button>
    <button class="theme-btn" data-theme="mangas">Mangas</button>
    <button class="theme-btn" data-theme="musique">Musique</button>
    <button class="theme-btn" data-theme="mythologie">Mythologie</button>
    <button class="theme-btn" data-theme="philosophie">Philosophie</button>
    <button class="theme-btn" data-theme="psychologie">Psychologie</button>
    <button class="theme-btn" data-theme="religions">Religions</button>
    <button class="theme-btn" data-theme="sciences">Sciences</button>
    <button class="theme-btn" data-theme="sport">Sport</button>
</div>

<!-- Carte du quiz -->
<div class="flashcard-container">
    <div class="flashcard" id="card">
        <div class="front">
            <div class="question" id="question"></div>
            <div class="answers" id="answers"></div>
        </div>

        <div class="back">
            <div class="correct-answer" id="correct-answer"></div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
